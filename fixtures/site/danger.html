<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fixture Site — Account settings</title>
  <link rel="stylesheet" href="/fixture.css" />
</head>
<body>
  <main>
  <h1>Account settings</h1>
  <nav><a href="/index.html">Home</a></nav>

  <section>
    <h2>Newsletter</h2>
    <form method="POST" action="/subscribe">
      <label for="newsletter-email">Email</label>
      <input id="newsletter-email" name="email" type="email" placeholder="you@example.com" required />
      <button type="submit">Subscribe</button>
    </form>
  </section>

  <section>
    <h2>Danger zone</h2>
    <form method="POST" action="/delete-account">
      <button id="delete-account" type="submit">Delete account</button>
    </form>
    <a href="/delete-account?action=delete&amp;id=42">Remove item via link</a>
  </section>
  </main>
</body>
</html>
