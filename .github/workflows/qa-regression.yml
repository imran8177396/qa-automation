name: QA Regression

# Full suite via npm run qa:all. Not a pull_request workflow (too heavy for every PR).
# Triggers: push to protected branches, weekly schedule, and manual dispatch.
# Still liveness/smoke JMeter only — qa:all strips --authorize-heavy / QA_PERF_AUTHORIZE.

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      discover_url:
        description: Optional live URL for qa:all --url=. Empty uses the in-repo fixture. Do not put secrets in this field.
        required: false
        type: string

concurrency:
  group: qa-regression-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qa-regression:
    name: Full regression (qa:all)
    timeout-minutes: 90
    runs-on: ubuntu-latest

    env:
      QA_PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      QA_WEBSITE_URL: http://127.0.0.1:4173/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Sync configs from qa.config.json
        run: npm run qa:sync

      - name: Record repository secret availability
        env:
          QA_WEBSITE_URL: ${{ secrets.QA_WEBSITE_URL }}
          QA_API_URL: ${{ secrets.QA_API_URL }}
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          QA_API_TOKEN: ${{ secrets.QA_API_TOKEN }}
          QA_API_USERNAME: ${{ secrets.QA_API_USERNAME }}
          QA_API_PASSWORD: ${{ secrets.QA_API_PASSWORD }}
        run: |
          record() {
            if [ -z "$2" ]; then
              echo "$1: not configured (auth-dependent checks may be REQUIRES_CONFIGURATION / NOT_TESTED)"
            else
              echo "$1: configured (value not printed)"
            fi
          }
          record QA_WEBSITE_URL "$QA_WEBSITE_URL"
          record QA_API_URL "$QA_API_URL"
          record QA_USERNAME "$QA_USERNAME"
          record QA_PASSWORD "$QA_PASSWORD"
          record QA_API_TOKEN "$QA_API_TOKEN"
          record QA_API_USERNAME "$QA_API_USERNAME"
          record QA_API_PASSWORD "$QA_API_PASSWORD"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JMeter
        run: |
          JMETER_VERSION=5.6.3
          curl -sL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" | tar xz
          echo "JMETER_HOME=$PWD/apache-jmeter-${JMETER_VERSION}" >> "$GITHUB_ENV"
          echo "$PWD/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Run full regression
        env:
          QA_API_URL: ${{ secrets.QA_API_URL }}
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          QA_API_TOKEN: ${{ secrets.QA_API_TOKEN }}
          QA_API_USERNAME: ${{ secrets.QA_API_USERNAME }}
          QA_API_PASSWORD: ${{ secrets.QA_API_PASSWORD }}
          QA_DISPATCH_URL: ${{ github.event.inputs.discover_url }}
        run: |
          if [ -n "$QA_DISPATCH_URL" ]; then
            npm run qa:all -- --url="$QA_DISPATCH_URL"
          else
            npm run qa:all
          fi

      - name: Generate Allure and combined QA reports
        if: always()
        run: npm run report:all

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            reports/allure/report/
            reports/allure/results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: |
            test-results/**/*.png
            test-results/**/*.jpg
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: |
            test-results/**/*.webm
            test-results/**/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Postman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-report
          path: reports/postman/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload JMeter reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report
          path: reports/jmeter/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: reports/lighthouse/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload final QA summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-final-summary
          path: |
            reports/summary/
            reports/orchestrator/
            reports/coverage/
            reports/performance/
          if-no-files-found: ignore
          retention-days: 30
